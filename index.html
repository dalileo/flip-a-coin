<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cara o Cruz</title>
  <meta name="description" content="Lanza una moneda: cara o cruz.">
  <meta name="theme-color" content="#0d0d0c">

  <!-- Aplica el tema guardado antes de pintar para evitar parpadeo -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>

  <link rel="stylesheet" href="css/style.css">
  <link rel="preload" as="image" href="img/coin-heads.webp">
  <link rel="preload" as="image" href="img/coin-tails.webp">

  <link rel="apple-touch-icon" sizes="180x180" href="img/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="img/favicon/favicon-16x16.png">
  <link rel="manifest" href="img/favicon/site.webmanifest">
</head>
<body>
  <header class="bar">
    <span class="bar__path"><span class="muted">~/</span>cara-o-cruz</span>
    <button class="link" id="theme-toggle" type="button">[claro]</button>
  </header>

  <main class="stage">
    <div class="arena">
      <button class="coin" id="coin" type="button" aria-label="Lanzar la moneda">
        <span class="coin__inner" id="coin-inner">
          <img class="coin__face coin__face--heads" src="img/coin-heads.webp" alt="" width="512" height="512" draggable="false">
          <img class="coin__face coin__face--tails" src="img/coin-tails.webp" alt="" width="512" height="512" draggable="false">
        </span>
      </button>
      <div class="coin-shadow" id="coin-shadow" aria-hidden="true"></div>
    </div>

    <p class="result" id="result" aria-hidden="true">----</p>
    <p class="sr-only" id="announce" aria-live="polite"></p>

    <p class="hint">
      <span class="hint--keys"><kbd>espacio</kbd> para lanzar</span>
      <span class="hint--touch">toca la moneda</span>
    </p>
  </main>

  <section class="log" aria-label="Estadísticas">
    <p class="line" id="stats-line"></p>
    <p class="line" id="history-line"></p>

    <div class="heatmap">
      <div class="heatmap__months" id="heatmap-months" aria-hidden="true"></div>
      <div class="heatmap__grid" id="heatmap" role="img"></div>
      <div class="heatmap__foot">
        <span class="muted" id="heatmap-caption"></span>
        <span class="legend" aria-hidden="true">
          menos
          <i data-l="0"></i><i data-l="1"></i><i data-l="2"></i><i data-l="3"></i><i data-l="4"></i>
          más
        </span>
      </div>
    </div>

    <button class="link" id="reset" type="button">[reiniciar]</button>
  </section>

  <script src="js/app.js" defer></script>
</body>
</html>
